<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estación Meteorológica Inteligente — Guía Docente</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Material didáctico y guías prácticas para el trayecto NovaMakers Avanzado (9-12 años)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0288d1;
    }
    .markdown-section {
      max-width: 80% !important;
    }
    nav.app-nav {
      position: absolute;
      right: 120px;
    }
    .sidebar {
      background-color: #fafafa;
    }
    .sidebar-nav li a {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">Cargando material didáctico de NovaMakers...</div>
  <script>
    window.$docsify = {
      name: '☀️ Estación Inteligente',
      loadSidebar: true,
      subMaxLevel: 3,
      homepage: 'README.md',
      auto2top: true,
      coverpage: false,
      executeScript: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en la guía...',
        noData: 'Sin resultados',
        depth: 4
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
